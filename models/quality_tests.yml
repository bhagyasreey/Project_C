version: 2

models:
  - name: stg_accounts
    columns:
      - name: account_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: branch_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_branches')
                field: branch_id

      - name: account_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - BLOCKED
                  - CLOSED
                  - DORMANT

  - name: stg_transactions
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique

      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: transaction_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - FAILED
                  - PENDING
                  - REVERSED
                  - SUCCESS
                config:
                  severity: error

  - name: stg_cards
    columns:
      - name: card_id
        data_tests:
          - not_null
          - unique

      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: card_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - BLOCKED
                  - EXPIRED
                  - CLOSED
              config:
                severity: warn

  - name: stg_loans
    columns:
      - name: loan_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: loan_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - CLOSED
                  - DEFAULTED
                  - PENDING
                config:
                  severity: error
      - name: sanctioned_amount
        data_tests:
          - non_negative

      - name: outstanding_amount
        data_tests:
          - non_negative

  - name: stg_loan_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: loan_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_loans')
                field: loan_id
      
      - name: payment_amount
        data_tests:
          - non_negative

      - name: principal_amount
        data_tests:
          - non_negative

      - name: interest_amount
        data_tests:
          - non_negative

 