
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'bhagya_banksphere'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'bhagya_banksphere'
on-run-start:
  - "{{ create_audit_table() }}"
  - "{{ log_run_start() }}"

on-run-end:
  - "{{ log_run_end(results) }}"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  analysis_start_date: '2025-01-01'
  high_value_transaction_threshold: 100000

models:
  bhagya_banksphere:

    staging:
      +materialized: view
      +schema: staging
      +tags:
        - staging

    intermediate:
      +materialized: view
      +schema: intermediate
      +tags:
        - intermediate

    dimensions:
      +materialized: table
      +schema: core
      +tags:
        - dimensions
        - core

    facts:
      +materialized: table
      +schema: core
      +tags:
        - facts
        - core

    marts:
      +materialized: table
      +schema: marts
      +tags:
        - marts

seeds:
  bhagya_banksphere:
    banking_reference_codes:
      +column_types:
        product_code: string
        product_group: string
        description: string
      +tags:
        - seed
        - reference_data

snapshots:
  bhagya_banksphere:
    +schema: snapshots